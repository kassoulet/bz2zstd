[package]
name = "parallel-bzip2-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
authors = ["Gautier Portet <gautier@soundconverter.org>"]
description = "Fuzz testing for parallel_bzip2_decoder"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.parallel_bzip2_decoder]
path = "../parallel_bzip2_decoder"

[[bin]]
name = "fuzz_scanner"
path = "fuzz_targets/fuzz_scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decoder"
path = "fuzz_targets/fuzz_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_block_decompress"
path = "fuzz_targets/fuzz_block_decompress.rs"
test = false
doc = false
bench = false
