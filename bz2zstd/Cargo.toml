[package]
name = "bz2zstd"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
authors = ["Gautier Portet <gautier@soundconverter.org>"]
description = "High-performance bzip2 to zstd converter"
homepage = "https://github.com/kassoulet/bz2zstd"
repository = "https://github.com/kassoulet/bz2zstd"
license = "MIT"
keywords = ["bzip2", "zstd", "compression", "converter"]
categories = ["compression", "command-line-utilities"]
readme = "../README.md"

[dependencies]
bzip2 = { version = "0.4", features = ["static"] }
rayon = "1.7"
memmap2 = "0.7"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
crossbeam-channel = "0.5"
zstd = { version = "0.13", features = ["zstdmt"] }
indicatif = "0.17"
parallel_bzip2_decoder = { path = "../parallel_bzip2_decoder", version = "0.2.0" }
