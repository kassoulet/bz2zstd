[package]
name = "parallel_bzip2_decoder"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["Gautier Portet <gautier@soundconverter.org>"]
description = "High-performance parallel bzip2 decompression library"
homepage = "https://github.com/parallel-bz2/parallel-bz2"
repository = "https://github.com/parallel-bz2/parallel-bz2"
documentation = "https://docs.rs/parallel_bzip2_decoder"
license = "MIT"
keywords = ["bzip2", "decompression", "parallel", "performance"]
categories = ["compression", "concurrency"]
readme = "README.md"
include = [
    "src/**/*",
    "benches/**/*",
    "examples/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
aho-corasick = "1.1.4"
crossbeam-channel = "0.5"
rayon = "1.7"
thiserror = "1.0"
bzip2 = { version = "0.4", features = ["static"] }
anyhow = "1.0"
memmap2 = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }

[[bench]]
name = "decode_benchmark"
harness = false

[[bench]]
name = "scanner_benchmark"
harness = false

[[bench]]
name = "e2e_benchmark"
harness = false
